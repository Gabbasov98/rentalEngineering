<div class="modal" id="contactsModal">
    <div class="modal__bg modal-bg _close-modal"></div>
    <div class="modal__dialog">
        <div class="h3 blue-text">
            Арендовать
        </div>
        <div class="_mt8">
            <div class="text18 medium-text blue-text">
                Грузопассажирский подъемник VECTOR SC 200
            </div>
        </div>
        <form action="" class="contacts-form">
            <div class="fg">
                <label>Ваше имя:</label>
                <input type="text">
            </div>
            <div class="fg">
                <label>Телефон:</label>
                <input type="tel">
            </div>
            <div class="fg">
                <label>Компания:</label>
                <input type="email">
            </div>
            <div class="fg">
                <label>Сообщение:</label>
                <textarea></textarea>
            </div>
            <div class="contacts-form__checks">
                <div class="m-check">
                    <input type="checkbox">
                    <label>
                        <span>
                            Я принимаю условия об обработке моих <a href="">персональных данных</a>
                        </span>
                    </label>
                </div>
                <div class="m-check">
                    <input type="checkbox">
                    <label>
                        <span>
                            Я согласен получать информационные <br>
                            и рекламные сообщения на указанный
                            email/телефон.
                        </span>
                    </label>
                </div>
            </div>
            <button class="contacts-form__btn m-btn m-btn-blue">
                <span>Отправить заявку</span>
            </button>
        </form>
        <button class="close-btn _close-modal">
            <img src="img/close.svg" alt="">
        </button>
    </div>
</div>

<div class="modal client-modal" id="clientModal">
    <div class="modal__bg modal-bg _close-modal"></div>
    <div class="modal__dialog">
        <div class="client-modal__img">
            <img src="" alt="">
        </div>
        <div class="client-modal__text text16">

        </div>
        <div class="_mt16">
            <a href="" class="client-modal__link tex14 blue-text underline-text">
                Перейти кновости
            </a>
        </div>
        <button class="close-btn _close-modal">
            <img src="img/close.svg" alt="">
        </button>
    </div>
</div>
